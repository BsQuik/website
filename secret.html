<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accesso riservato — BsQuik</title>
<!-- Pagina volutamente non indicizzata: non è pensata per i motori di ricerca -->
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="secret-page__top">
  <a href="index.html" class="secret-page__back">← Torna al sito</a>
</div>

<div class="secret-page">

  <!-- ============ GATE: password richiesta ad ogni visita/refresh ============ -->
  <div class="secret-page__gate" id="secretGate">
    <p class="secret-page__title" style="font-family: var(--font-mono); color: var(--coral); font-size: 1rem; margin-bottom: 6px;">// accesso riservato</p>
    <h1>Questa stanza è protetta</h1>
    <p>Reinserisci la password ogni volta: non viene mai ricordata da questo browser.</p>
    <form id="secretPageForm" class="secret-page__form">
      <input type="password" id="secretPageInput" class="secret-page__input" placeholder="password" autocomplete="off">
      <button type="submit" class="btn btn--primary btn--small">Entra</button>
    </form>
    <p id="secretPageError" class="secret-page__error" aria-live="polite"></p>
  </div>

  <!-- ============ CONTENUTO SEGRETO: rivelato solo dopo password corretta ============ -->
  <div class="secret-page__content" id="secretContent" hidden>
    <h1>Accesso concesso.</h1>
    <div class="secret-page__log" id="secretLog" aria-live="polite"><span id="secretLogText"></span><span class="cursor" aria-hidden="true">▌</span></div>
    <div class="secret-page__actions">
      <button type="button" id="secretLogout" class="btn btn--ghost btn--small">Chiudi sessione</button>
    </div>
    <p class="secret-page__reload-note">La password non resta mai salvata: "Chiudi sessione" (o un semplice refresh) riporta al gate.</p>
  </div>

  <!-- Testo del log, tenuto fuori dalla vista e "digitato" da secret-gate.js -->
  <template id="secretLogSource">> connessione stabilita
> caricamento profilo utente... ok
> tema Hacker attivato per questa sessione

Ciao, e benvenuto nella stanza segreta del sito.

Non c'è niente di ufficiale qui dentro: solo un grazie per essere
arrivato/a fin qui, che tu ci sia arrivato/a con il Konami Code,
cliccando il bottone nascosto nel footer, o semplicemente perché
qualcuno ti ha passato la password.

Qualche nota per chi è curioso:
- questo sito è fatto a mano, HTML/CSS/JS puro, niente framework
- i minigiochi salvano il record solo in questo browser
- i tentativi di password sono limitati: troppi errori di fila
  bloccano temporaneamente il form (rate limiting lato client)
- la password di questa pagina non viene mai ricordata:
  ricaricando, va reinserita da capo

A presto, dall'altra parte dello schermo.
— BsQuik</template>

</div>

<script src="secret-gate.js"></script>
</body>
</html>
